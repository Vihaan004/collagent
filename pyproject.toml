[project]
name = "collagent"
version = "0.1.0"
description = "collagent - an agent for managing your classes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "langchain>=1.2.16",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
]

[project.scripts]
collagent = "collagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collagent"]
