# Render Blueprint for the backend. Connect the repo in Render and it reads this.
# Secret values are marked sync:false — set them in the Render dashboard, never in git.
services:
  - type: web
    name: collagent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: MAJOR_MAP_ENABLED
        value: "false"
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: MODEL_NAME
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
